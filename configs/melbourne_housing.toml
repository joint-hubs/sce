# Configuration for Melbourne Housing Market dataset (Australian real estate)

[dataset]
name = "melbourne_housing"
description = "Property prices in Melbourne, Australia"
source = "kaggle"
path = "data/parquet/melbourne_housing.parquet"

[target]
column = "Price"
description = "Property sale price in AUD"

[features]
numeric = ["Rooms", "Distance", "Bedroom2", "Bathroom", "Car", "Landsize", "BuildingArea", "YearBuilt", "Propertycount", "month", "year"]
categorical = ["Suburb", "Type", "Method", "Regionname", "CouncilArea", "Postcode"]

[sce]
aggregations = ["mean", "median", "std", "count", "q05", "q10", "q20", "q33", "q66", "q80", "q90", "q95"]
min_group_size = 3
use_cross_fitting = true
n_folds = 5
include_interactions = false
max_interaction_depth = 1
max_cardinality = 500

[model]
type = "xgboost"
n_estimators = 100
max_depth = 6
learning_rate = 0.1

[run]
xgboost_configs = ["shallow", "boosted", "default"]
p_threshold = 0.05

[run.search]
sampling_pct = 5.0
min_configs = 50
max_configs = 500
run_ablation = true
run_significance_selection = true

[run.lm_selection]
enabled = true
p_threshold = 0.05
max_features = 100
