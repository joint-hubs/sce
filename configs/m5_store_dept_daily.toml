# Configuration for M5 daily demand benchmark aggregated to store-department level

[dataset]
name = "m5_store_dept_daily"
description = "Hierarchical daily demand benchmark aggregated to store-department level"
source = "generated"
path = "data/parquet/m5_store_dept_daily.parquet"

[target]
column = "demand"
description = "Daily unit demand"

[features]
numeric = ["avg_sell_price", "wday", "month", "year", "day", "snap_state", "lag_7", "lag_28", "rolling_mean_7", "rolling_mean_28"]
categorical = ["state_id", "store_id", "cat_id", "dept_id", "event_name_1", "event_type_1", "event_name_2", "event_type_2"]

[sce]
aggregations = ["mean", "median", "std", "count", "q05", "q20", "q80", "q95"]
min_group_size = 7
use_cross_fitting = false
# Temporal benchmark keeps cross-fitting disabled unless time-aware strategy is explicitly enabled.
n_folds = 5
include_interactions = false
max_interaction_depth = 1
max_cardinality = 5000

[split]
strategy = "temporal"
time_col = "date"
test_periods = 28

[model]
type = "xgboost"
n_estimators = 200
max_depth = 6
learning_rate = 0.05

[run]
xgboost_configs = ["shallow", "boosted", "default"]
p_threshold = 0.05

[run.search]
sampling_pct = 5.0
min_configs = 50
max_configs = 300
run_ablation = true
run_significance_selection = true

[run.lm_selection]
enabled = true
p_threshold = 0.05
max_features = 100